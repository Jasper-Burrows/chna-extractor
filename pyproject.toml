[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "chna-extractor"
version = "1.0.0"
description = "Evidence-first Community Health Needs Assessment extraction"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Jasper Burrows" }]
dependencies = [
  "aiosqlite==0.22.1",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "openai==3.24.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pymupdf==1.28.2",
  "python-multipart==0.0.32",
  "structlog==26.1.0",
  "typer==0.27.2",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "hypothesis==6.168.3",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.10",
]

[project.scripts]
chna = "chna_extractor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chna_extractor"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=chna_extractor --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in external-provider validation requiring explicit approval"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["chna_extractor"]

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["chna_extractor"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
